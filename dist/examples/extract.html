<!doctype html>
<meta charset="utf-8">
<title>mkv.js extractor</title>
<link rel="stylesheet" href="../main.css">
<main class="card">
  <h1>Extract tracks</h1>
  <div class="file-drop-area">
    <span class="fake-btn">Choose MKV files</span>
    <span class="file-msg">or drag and drop files here</span>
    <input class="file-input" type="file" multiple accept=".mkv,.webm">
  </div>
  <p class="file-status"></p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/1.3.3/FileSaver.min.js"></script>
<script src="../iife/mkv.global.js"></script>
<script>
  mkvjs.createExtractorUI({ statusEl: document.querySelector('.file-status') })
</script>
